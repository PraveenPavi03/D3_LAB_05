<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D3 Sankey - Data Pipeline</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12/dist/d3-sankey.min.js"></script>
<style>body{font-family:Arial,sans-serif;margin:20px}svg{border:1px solid #ccc}</style>
</head>
<body>
<h1>D3 Sankey - Data Pipeline</h1>
<div id="graph"></div>
<script>
const width=900,height=450;
const nodes=[
{name:"Web Logs"},{name:"Mobile App"},{name:"CRM Export"},{name:"Data Cleaning"},
{name:"Rejected"},{name:"EDA"},{name:"Feature Engineering"},{name:"Model Training"},
{name:"Evaluation"},{name:"Visualization"},{name:"Deployment"}];
const links=[
{source:"Web Logs",target:"Data Cleaning",value:5000},
{source:"Mobile App",target:"Data Cleaning",value:3000},
{source:"CRM Export",target:"Data Cleaning",value:2000},
{source:"Data Cleaning",target:"EDA",value:8500},
{source:"Data Cleaning",target:"Rejected",value:1500},
{source:"EDA",target:"Feature Engineering",value:6000},
{source:"EDA",target:"Visualization",value:2500},
{source:"Feature Engineering",target:"Model Training",value:4800},
{source:"Feature Engineering",target:"Evaluation",value:1200},
{source:"Model Training",target:"Evaluation",value:4800},
{source:"Evaluation",target:"Deployment",value:5000},
{source:"Evaluation",target:"Visualization",value:1000}];
const svg=d3.select("#graph").append("svg").attr("width",width).attr("height",height);
const graph=d3.sankey().nodeId(d=>d.name).nodeWidth(16).nodePadding(20).extent([[10,10],[width-10,height-10]])({
nodes:nodes.map(d=>({...d})),links:links.map(d=>({...d}))});
const color=d3.scaleOrdinal(d3.schemeTableau10);
svg.append("g").selectAll("path").data(graph.links).join("path")
.attr("d",d3.sankeyLinkHorizontal()).attr("fill","none")
.attr("stroke",d=>color(d.source.name)).attr("stroke-opacity",.4)
.attr("stroke-width",d=>Math.max(1,d.width));
svg.append("g").selectAll("rect").data(graph.nodes).join("rect")
.attr("x",d=>d.x0).attr("y",d=>d.y0).attr("width",d=>d.x1-d.x0).attr("height",d=>d.y1-d.y0)
.attr("fill",d=>color(d.name)).on("mouseover",function(e,d){d3.select(this).attr("opacity",.7)})
.on("mouseout",function(e,d){d3.select(this).attr("opacity",1)});
svg.append("g").selectAll("text").data(graph.nodes).join("text").text(d=>d.name)
.attr("font-size",11).attr("x",d=>d.x0<width/2?d.x1+6:d.x0-6)
.attr("y",d=>(d.y0+d.y1)/2).attr("dy",".35em")
.attr("text-anchor",d=>d.x0<width/2?"start":"end");
</script>
</body>
</html>
